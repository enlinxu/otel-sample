apiVersion: apps/v1
kind: Deployment
metadata:
  name: haproxy
  namespace: otel-java-sample
spec:
  replicas: 1
  selector:
    matchLabels:
      app: haproxy
  template:
    metadata:
      labels:
        app: haproxy
    spec:
      containers:
      - name: haproxy
        image: otel-java/haproxy:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: haproxy
  namespace: otel-java-sample
spec:
  selector:
    app: haproxy
  ports:
  - port: 8080
    targetPort: 8080