spring:
  application:
    name: inventory-service
  main:
    lazy-initialization: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:5432/${POSTGRES_DB:otel}
    username: ${POSTGRES_USER:otel}
    password: ${POSTGRES_PASSWORD:otel}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

rabbitmq:
  queue: inventory-events

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info