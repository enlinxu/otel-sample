apiVersion: v1
kind: Namespace
metadata:
  name: otel-sample-zero
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: otel-sample-zero
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: otel
        - name: POSTGRES_USER
          value: otel
        - name: POSTGRES_PASSWORD
          value: otel
        readinessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U otel -d otel"]
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: otel-sample-zero
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: otel-sample-zero
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      initContainers:
      - name: copy-auto-instrumentation
        image: alpine:3.20
        command:
        - sh
        - -c
        - |
          set -eux
          apk add --no-cache curl unzip
          curl -sSfLo /tmp/otel-dotnet-auto-install.sh \
            https://github.com/open-telemetry/opentelemetry-dotnet-instrumentation/releases/latest/download/otel-dotnet-auto-install.sh
          OTEL_DOTNET_AUTO_HOME=/otel-auto/auto VERSION=v1.13.0 OS_TYPE=linux-glibc ARCHITECTURE=arm64 sh /tmp/otel-dotnet-auto-install.sh
          rm -f /tmp/otel-dotnet-auto-install.sh
        volumeMounts:
        - name: otel-auto
          mountPath: /otel-auto
      containers:
      - name: inventory-service
        image: otel-sample-zero/inventory-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: ConnectionStrings__Postgres
          value: Host=postgres.otel-sample-zero.svc.cluster.local;Port=5432;Database=otel;Username=otel;Password=otel
        - name: OTEL_SERVICE_NAME
          value: inventory-service
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://opentelemetry-collector.default.svc.cluster.local:4317
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: grpc
        - name: OTEL_DOTNET_AUTO_HOME
          value: /otel-auto/auto
        - name: CORECLR_ENABLE_PROFILING
          value: "1"
        - name: CORECLR_PROFILER
          value: "{918728DD-259F-4A6A-AC2B-B85E1B658318}"
        - name: CORECLR_PROFILER_PATH
          value: /otel-auto/auto/linux-arm64/OpenTelemetry.AutoInstrumentation.Native.so
        - name: DOTNET_ADDITIONAL_DEPS
          value: /otel-auto/auto/AdditionalDeps
        - name: DOTNET_SHARED_STORE
          value: /otel-auto/auto/store
        - name: DOTNET_STARTUP_HOOKS
          value: /otel-auto/auto/net/OpenTelemetry.AutoInstrumentation.StartupHook.dll
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: otel-auto
          mountPath: /otel-auto
      volumes:
      - name: otel-auto
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: otel-sample-zero
spec:
  selector:
    app: inventory-service
  ports:
  - port: 8080
    targetPort: 8080
---
