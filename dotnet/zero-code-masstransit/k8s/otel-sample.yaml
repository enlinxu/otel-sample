apiVersion: v1
kind: Namespace
metadata:
  name: otel-sample-zero-masstransit
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: otel-sample-zero-masstransit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: otel
        - name: POSTGRES_USER
          value: otel
        - name: POSTGRES_PASSWORD
          value: otel
        readinessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U otel -d otel"]
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: otel-sample-zero-masstransit
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: otel-sample-zero-masstransit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:4-management
        ports:
        - containerPort: 5672
        - containerPort: 15672
        readinessProbe:
          tcpSocket:
            port: 5672
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: otel-sample-zero-masstransit
spec:
  selector:
    app: rabbitmq
  ports:
  - name: amqp
    port: 5672
    targetPort: 5672
  - name: management
    port: 15672
    targetPort: 15672
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
  namespace: otel-sample-zero-masstransit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
      - name: clickhouse
        image: clickhouse/clickhouse-server:25.3
        env:
        - name: CLICKHOUSE_USER
          value: otel
        - name: CLICKHOUSE_PASSWORD
          value: otel
        ports:
        - containerPort: 8123
        - containerPort: 9000
        readinessProbe:
          httpGet:
            path: /ping
            port: 8123
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: otel-sample-zero-masstransit
spec:
  selector:
    app: clickhouse
  ports:
  - name: http
    port: 8123
    targetPort: 8123
  - name: native
    port: 9000
    targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: otel-sample-zero-masstransit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7
        ports:
        - containerPort: 6379
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: otel-sample-zero-masstransit
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: otel-sample-zero-masstransit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      initContainers:
      - name: copy-auto-instrumentation
        image: alpine:3.20
        env:
        - name: OTEL_AUTO_VERSION
          value: v1.9.0
        command:
        - sh
        - -c
        - |
          set -eux
          apk add --no-cache curl unzip
          : "${OTEL_AUTO_VERSION:=v1.9.0}"
          curl -sSfLo /tmp/otel-dotnet-auto-install.sh \
            https://github.com/open-telemetry/opentelemetry-dotnet-instrumentation/releases/download/${OTEL_AUTO_VERSION}/otel-dotnet-auto-install.sh
          OTEL_DOTNET_AUTO_HOME=/otel-auto/auto VERSION=${OTEL_AUTO_VERSION} OS_TYPE=linux-glibc ARCHITECTURE=arm64 sh /tmp/otel-dotnet-auto-install.sh
          rm -f /tmp/otel-dotnet-auto-install.sh
        volumeMounts:
        - name: otel-auto
          mountPath: /otel-auto
      containers:
      - name: inventory-service
        image: otel-sample-zero-masstransit/inventory-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: OTEL_AUTO_VERSION
          value: v1.9.0
        - name: ConnectionStrings__Postgres
          value: Host=postgres.otel-sample-zero-masstransit.svc.cluster.local;Port=5432;Database=otel;Username=otel;Password=otel
        - name: ConnectionStrings__ClickHouse
          value: Host=clickhouse.otel-sample-zero-masstransit.svc.cluster.local;Protocol=http;Port=8123;Username=otel;Password=otel
        - name: ConnectionStrings__Redis
          value: redis.otel-sample-zero-masstransit.svc.cluster.local:6379
        - name: RabbitMq__Host
          value: rabbitmq.otel-sample-zero-masstransit.svc.cluster.local
        - name: RabbitMq__Port
          value: "5672"
        - name: RabbitMq__Username
          value: guest
        - name: RabbitMq__Password
          value: guest
        - name: RabbitMq__Queue
          value: sit.user-activity
        - name: OTEL_SERVICE_NAME
          value: inventory-service
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://opentelemetry-collector.default.svc.cluster.local:4317
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: grpc
        - name: OTEL_DOTNET_AUTO_HOME
          value: /otel-auto/auto
        - name: CORECLR_ENABLE_PROFILING
          value: "1"
        - name: CORECLR_PROFILER
          value: "{918728DD-259F-4A6A-AC2B-B85E1B658318}"
        - name: CORECLR_PROFILER_PATH
          value: /otel-auto/auto/linux-arm64/OpenTelemetry.AutoInstrumentation.Native.so
        - name: DOTNET_ADDITIONAL_DEPS
          value: /otel-auto/auto/AdditionalDeps
        - name: DOTNET_SHARED_STORE
          value: /otel-auto/auto/store
        - name: DOTNET_STARTUP_HOOKS
          value: /otel-auto/auto/net/OpenTelemetry.AutoInstrumentation.StartupHook.dll
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: otel-auto
          mountPath: /otel-auto
      volumes:
      - name: otel-auto
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: otel-sample-zero-masstransit
spec:
  selector:
    app: inventory-service
  ports:
  - port: 8080
    targetPort: 8080
---
